<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Profile - CorpoCalm Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; }
        .navbar { background: linear-gradient(135deg,#1a237e,#283593); color: white; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 60px; }
        .navbar-brand { font-size: 18px; font-weight: 700; }
        .navbar-nav { display: flex; gap: 6px; align-items: center; }
        .nav-link { color: rgba(255,255,255,0.8); text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 14px; }
        .nav-link:hover { background: rgba(255,255,255,0.15); color: white; }
        .btn-logout { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 5px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
        .page { max-width: 960px; margin: 28px auto; padding: 0 20px 60px; }
        .back-link { color: #1a237e; text-decoration: none; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 20px; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .card { background: white; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); margin-bottom: 20px; overflow: hidden; }
        .card-header { background: linear-gradient(135deg,#1a237e,#283593); color: white; padding: 20px 24px; }
        .card-header h2 { font-size: 20px; margin-bottom: 4px; }
        .card-header .sub { font-size: 13px; opacity: 0.8; }
        .card-body { padding: 22px 24px; }
        .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid #eee; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .info-item .label { font-size: 11px; text-transform: uppercase; color: #aaa; margin-bottom: 3px; font-weight: 600; }
        .info-item .value { font-size: 15px; color: #333; font-weight: 500; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 700; display: inline-block; }
        .badge-passed      { background:#e8f5e9; color:#2e7d32; }
        .badge-failed      { background:#ffebee; color:#c62828; }
        .badge-shortlisted { background:#e8f5e9; color:#1b5e20; border:1px solid #a5d6a7; }
        .badge-rejected    { background:#ffebee; color:#b71c1c; border:1px solid #ef9a9a; }
        .badge-reviewing   { background:#fff3e0; color:#e65100; border:1px solid #ffcc80; }
        .score-circle { width:72px; height:72px; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; font-weight:800; border:4px solid; }
        .score-high { border-color:#2e7d32; color:#2e7d32; }
        .score-mid  { border-color:#e65100; color:#e65100; }
        .score-low  { border-color:#c62828; color:#c62828; }
        .answer-block { margin-bottom: 18px; border-bottom: 1px solid #eee; padding-bottom: 16px; }
        .answer-block:last-child { border-bottom: none; padding-bottom: 0; }
        .q-label { font-weight: 700; color: #1a237e; margin-bottom: 6px; font-size: 14px; }
        .a-text { color: #444; line-height: 1.75; white-space: pre-wrap; font-size: 14px; }
        .timeline { list-style: none; padding: 0; }
        .timeline li { display: flex; gap: 14px; margin-bottom: 16px; }
        .tl-dot { width: 12px; height: 12px; border-radius: 50%; background: #1a237e; flex-shrink: 0; margin-top: 4px; }
        .tl-content .tl-title { font-weight: 600; font-size: 14px; }
        .tl-content .tl-time  { font-size: 12px; color: #aaa; margin-top: 2px; }
        .notes-wrap textarea { width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; font-size:13px; resize:vertical; font-family:inherit; min-height:90px; }
        .btn-save { margin-top: 8px; padding: 8px 18px; background: #1a237e; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-save:hover { background: #283593; }
        .saved-msg { color: #2e7d32; font-size: 12px; margin-left: 10px; display: none; }
        .hr-action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .btn-shortlist { background:#e8f5e9; color:#2e7d32; border:1px solid #a5d6a7; padding:7px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; }
        .btn-shortlist:hover { background:#2e7d32; color:white; }
        .btn-review    { background:#fff3e0; color:#e65100; border:1px solid #ffcc80; padding:7px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; }
        .btn-review:hover    { background:#e65100; color:white; }
        .btn-reject    { background:#ffebee; color:#c62828; border:1px solid #ef9a9a; padding:7px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; }
        .btn-reject:hover    { background:#c62828; color:white; }
        .resume-box { border: 2px dashed #ccc; border-radius: 8px; padding: 20px; text-align: center; }
        .resume-box a { color: #1a237e; font-weight: 600; }
        .loading-msg { text-align: center; padding: 60px; color: #888; }
        .spinner { width:36px; height:36px; border:4px solid #e0e0e0; border-top-color:#1a237e; border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 14px; }
        @keyframes spin { to { transform:rotate(360deg); } }
        footer { text-align:center; padding:20px; font-size:12px; color:#aaa; }
        @media(max-width:600px){ .info-grid{grid-template-columns:1fr;} }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">CorpoCalm Gateway</div>
    <div class="navbar-nav">
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="analytics.html" class="nav-link">Analytics</a>
        <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="page">
    <a href="dashboard.html" class="back-link">&#8592; Back to Dashboard</a>

    <div id="loadingSection" class="loading-msg">
        <div class="spinner"></div><p>Loading candidate profile...</p>
    </div>

    <div id="profileContent" style="display:none;"></div>
</div>

<footer>CorpoCalm Gateway &nbsp;|&nbsp; Built by <strong>Priti Ganesh Lande</strong> &nbsp;|&nbsp; &copy; 2026</footer>

<script src="config.js"></script>
<script>
const token = localStorage.getItem('hr_token');
if (!token) window.location.href = 'login.html';

const params = new URLSearchParams(window.location.search);
const appId  = params.get('id');
if (!appId) window.location.href = 'dashboard.html';

let profileData = null;

function logout() {
    localStorage.removeItem('hr_token');
    localStorage.removeItem('hr_name');
    window.location.href = 'login.html';
}

function esc(str) {
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function scoreCls(s) { return s>=70?'score-high':s>=40?'score-mid':'score-low'; }

function badgeHtml(aiStatus, hrStatus) {
    if (hrStatus==='Shortlisted') return `<span class="badge badge-shortlisted">Shortlisted</span>`;
    if (hrStatus==='Rejected')    return `<span class="badge badge-rejected">Rejected</span>`;
    if (hrStatus==='Reviewing')   return `<span class="badge badge-reviewing">Reviewing</span>`;
    if (aiStatus==='Passed')      return `<span class="badge badge-passed">Passed</span>`;
    if (aiStatus==='Failed')      return `<span class="badge badge-failed">Failed</span>`;
    return `<span class="badge" style="background:#eee;color:#555;">Submitted</span>`;
}

async function loadProfile() {
    try {
        const res = await fetch(`${CONFIG.BACKEND_URL}/applications/${appId}/profile`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (!res.ok) throw new Error(`Server error: ${res.status}`);
        profileData = await res.json();
        renderProfile(profileData);
    } catch (err) {
        document.getElementById('loadingSection').innerHTML =
            `<p style="color:red;">Failed to load profile: ${err.message}</p>`;
    }
}

function renderProfile(d) {
    const { application: a, answers, job, history } = d;
    const sc = a.ai_score;
    const sClass = sc != null ? scoreCls(sc) : 'score-low';

    const skills = (job.skills_required||'').split(',').map(s=>s.trim()).filter(Boolean);
    const skillsHtml = skills.length
        ? skills.map(s=>`<span style="background:#e8eaf6;color:#1a237e;padding:3px 12px;border-radius:20px;font-size:13px;font-weight:500;">${esc(s)}</span>`).join('')
        : '<span style="color:#aaa;font-size:13px;">Not specified</span>';

    const answersHtml = answers.length
        ? answers.map((ans,i)=>`
            <div class="answer-block">
                <p class="q-label">Q${i+1}: ${esc(ans.question_text)}</p>
                <p class="a-text">${esc(ans.candidate_answer)||'<em style="color:#aaa;">No answer provided</em>'}</p>
            </div>`).join('')
        : '<p style="color:#aaa;">No answers recorded.</p>';

    const historyHtml = history.map((h,i)=>`
        <li>
            <div class="tl-dot"></div>
            <div class="tl-content">
                <div class="tl-title">Attempt ${h.attempt_number} — Score: ${h.ai_score??'N/A'}/100 — ${h.status||'Submitted'}</div>
                <div class="tl-time">${h.submit_time ? new Date(h.submit_time).toLocaleString() : new Date(h.created_at).toLocaleString()} &nbsp;|&nbsp; Tab switches: ${h.tab_switch_count??0}</div>
            </div>
        </li>`).join('');

    const resumeHtml = a.resume_url
        ? `<div class="resume-box"><a href="${esc(a.resume_url)}" target="_blank">&#128206; View / Download Resume</a></div>`
        : `<div class="resume-box" style="color:#aaa;">No resume uploaded yet.</div>`;

    document.getElementById('loadingSection').style.display = 'none';
    document.getElementById('profileContent').style.display = 'block';
    document.getElementById('profileContent').innerHTML = `

        <!-- Header Card -->
        <div class="card">
            <div class="card-header">
                <h2>${esc(a.candidate_name)}</h2>
                <div class="sub">${esc(a.candidate_email)} &nbsp;|&nbsp; Applied for: <strong>${esc(job.role_title||'Unknown Role')}</strong></div>
            </div>
            <div class="card-body">
                <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;">
                    <div style="flex:1;">
                        <div class="section-title">Personal & Assessment Details</div>
                        <div class="info-grid">
                            <div class="info-item"><div class="label">Name</div><div class="value">${esc(a.candidate_name)}</div></div>
                            <div class="info-item"><div class="label">Email</div><div class="value">${esc(a.candidate_email)}</div></div>
                            <div class="info-item"><div class="label">Job Role</div><div class="value">${esc(job.role_title||'—')}</div></div>
                            <div class="info-item"><div class="label">Location</div><div class="value">${esc(job.location||'—')}</div></div>
                            <div class="info-item"><div class="label">Tab Switches</div><div class="value">${a.tab_switch_count??0}${(a.tab_switch_count>2)?` <span style="color:#c62828;">&#9888;</span>`:''}</div></div>
                            <div class="info-item"><div class="label">Face Away (Proctoring)</div><div class="value">${a.face_away_count??0}${(a.face_away_count>2)?` <span style="color:#c62828;">&#9888;</span>`:''}</div></div>
                            <div class="info-item"><div class="label">Camera</div><div class="value">${a.camera_declined?'<span style="color:#e65100;">⚠️ Declined</span>':'<span style="color:#2e7d32;">✅ Active</span>'}</div></div>
                            <div class="info-item"><div class="label">Attempt #</div><div class="value">${a.attempt_number}</div></div>
                            <div class="info-item"><div class="label">Submitted</div><div class="value">${a.submit_time?new Date(a.submit_time).toLocaleString():new Date(a.created_at).toLocaleString()}</div></div>
                            <div class="info-item"><div class="label">Status</div><div class="value">${badgeHtml(a.status,a.hr_status)}</div></div>
                        </div>
                        ${(a.github_url || a.portfolio_url) ? `
                        <div style="margin-top:16px;">
                            <div class="section-title">Links</div>
                            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                                ${a.github_url ? `<a href="${esc(a.github_url)}" target="_blank" rel="noopener"
                                    style="display:inline-flex;align-items:center;gap:6px;padding:7px 16px;background:#24292e;color:white;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;">
                                    🐙 GitHub Profile
                                </a>` : ''}
                                ${a.portfolio_url ? `<a href="${esc(a.portfolio_url)}" target="_blank" rel="noopener"
                                    style="display:inline-flex;align-items:center;gap:6px;padding:7px 16px;background:#1a237e;color:white;border-radius:6px;text-decoration:none;font-size:13px;font-weight:600;">
                                    🌐 Portfolio / Website
                                </a>` : ''}
                            </div>
                        </div>` : ''}
                    </div>
                    <div style="text-align:center;">
                        <div class="section-title" style="text-align:left;">AI Score</div>
                        <div class="score-circle ${sClass}" style="margin:0 auto;">
                            <span style="font-size:22px;">${sc!=null?sc:'N/A'}</span>
                            ${sc!=null?`<span style="font-size:10px;">/ 100</span>`:''}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Skills Card -->
        <div class="card">
            <div class="card-body">
                <div class="section-title">Required Skills for This Role</div>
                <div style="display:flex;flex-wrap:wrap;gap:8px;">${skillsHtml}</div>
            </div>
        </div>

        <!-- Resume Card -->
        <div class="card">
            <div class="card-body">
                <div class="section-title">Resume</div>
                ${resumeHtml}
            </div>
        </div>

        <!-- Assessment History -->
        <div class="card">
            <div class="card-body">
                <div class="section-title">Assessment History</div>
                <ul class="timeline">${historyHtml||'<li style="color:#aaa;font-size:13px;">No history found.</li>'}</ul>
            </div>
        </div>

        <!-- AI Feedback Card -->
        ${(a.ai_feedback) ? (() => {
            let fb = {};
            try { fb = JSON.parse(a.ai_feedback); } catch(e) { fb = { overall: a.ai_feedback }; }
            const qScores  = fb.question_scores || [];
            const perQ     = fb.per_question || [];
            const perQHtml = perQ.length ? perQ.map((f,i) => `
                <div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid #f5f5f5;align-items:flex-start;">
                    <div style="min-width:36px;text-align:center;">
                        <div style="font-size:11px;color:#aaa;font-weight:600;">Q${i+1}</div>
                        ${qScores[i] != null ? `<div style="font-size:15px;font-weight:800;color:${qScores[i]>=70?'#2e7d32':qScores[i]>=40?'#e65100':'#c62828'};">${qScores[i]}</div>` : ''}
                    </div>
                    <div style="font-size:13px;color:#444;line-height:1.6;">${esc(f)}</div>
                </div>`).join('') : '';
            return `
        <div class="card">
            <div class="card-body">
                <div class="section-title">🤖 AI Score Explanation</div>
                ${fb.overall ? `
                <div style="background:#f0f4ff;border-left:4px solid #3f51b5;padding:14px 16px;border-radius:6px;margin-bottom:16px;font-size:14px;color:#333;line-height:1.7;">
                    ${esc(fb.overall)}
                </div>` : ''}
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;">
                    ${fb.strengths ? `
                    <div style="background:#e8f5e9;border-radius:8px;padding:14px;">
                        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#2e7d32;margin-bottom:6px;">✅ Strengths</div>
                        <div style="font-size:13px;color:#333;line-height:1.6;">${esc(fb.strengths)}</div>
                    </div>` : ''}
                    ${fb.improvements ? `
                    <div style="background:#fff8e1;border-radius:8px;padding:14px;">
                        <div style="font-size:11px;font-weight:700;text-transform:uppercase;color:#f57f17;margin-bottom:6px;">💡 Areas to Improve</div>
                        <div style="font-size:13px;color:#333;line-height:1.6;">${esc(fb.improvements)}</div>
                    </div>` : ''}
                </div>
                ${perQHtml ? `
                <div style="font-size:12px;font-weight:700;text-transform:uppercase;color:#888;margin-bottom:8px;">Per-Question Feedback</div>
                ${perQHtml}` : ''}
            </div>
        </div>`;
        })() : ''}

        <!-- Answers Card -->
        <div class="card">
            <div class="card-body">
                <div class="section-title">Assessment Answers</div>
                ${answersHtml}
            </div>
        </div>

        <!-- HR Actions & Notes -->
        <div class="card">
            <div class="card-body">
                <div class="section-title">HR Actions</div>
                <div class="hr-action-row">
                    <button class="btn-shortlist" onclick="setStatus('Shortlisted')">&#10003; Shortlist</button>
                    <button class="btn-review"    onclick="setStatus('Reviewing')">&#128269; Mark Reviewing</button>
                    <button class="btn-reject"    onclick="setStatus('Rejected')">&#10007; Reject</button>
                </div>
                <div class="section-title" style="margin-top:16px;">Recruiter Notes</div>
                <div class="notes-wrap">
                    <textarea id="hrNotesArea" placeholder="Add internal notes about this candidate...">${esc(a.hr_notes||'')}</textarea>
                    <button class="btn-save" onclick="saveNotes()">Save Notes</button>
                    <span class="saved-msg" id="savedMsg">Saved!</span>
                </div>
            </div>
        </div>`;


loadProfile();
</script>
</body>
</html>
