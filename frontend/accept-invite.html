<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accept Invite — CorpoCalm Gateway</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; width: 420px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 32px; text-align: center; }
        .card-header h1 { font-size: 22px; margin-bottom: 4px; }
        .card-header p { font-size: 13px; opacity: 0.8; }
        .card-body { padding: 32px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; margin-top: 14px; }
        input { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 7px; font-size: 14px; transition: border 0.2s; }
        input:focus { border-color: #3f51b5; outline: none; box-shadow: 0 0 0 3px rgba(63,81,181,0.1); }
        button.primary { width: 100%; padding: 13px; background: #1a237e; color: white; border: none; border-radius: 7px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        button.primary:hover { background: #283593; }
        button.primary:disabled { background: #aaa; cursor: not-allowed; }
        .msg { margin-top: 14px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
        .msg.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .invalid-box { text-align: center; padding: 24px; color: #c62828; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <h1>CorpoCalm Gateway</h1>
        <p>Accept Team Invitation</p>
    </div>
    <div class="card-body" id="formArea">
        <p style="font-size:14px;color:#555;margin-bottom:4px;">You've been invited to join an HR team. Create your account below.</p>

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Your full name">

        <label>Email</label>
        <input type="email" id="email" placeholder="Loading..." disabled>

        <label>Password</label>
        <input type="password" id="password" placeholder="Create a password (min 6 chars)">

        <button class="primary" id="submitBtn" onclick="acceptInvite()">Create Account & Join Team</button>

        <div class="msg" id="msg"></div>
    </div>
</div>

<script src="config.js"></script>
<script>
    const params = new URLSearchParams(window.location.search);
    const inviteToken = params.get('token');

    if (!inviteToken) {
        document.getElementById('formArea').innerHTML = '<div class="invalid-box">Invalid invite link. Please ask your admin to resend.</div>';
    }

    async function acceptInvite() {
        const name     = document.getElementById('name').value.trim();
        const password = document.getElementById('password').value.trim();
        const btn      = document.getElementById('submitBtn');

        if (!name)            { showMsg('Please enter your full name.', 'error'); return; }
        if (!password)        { showMsg('Please enter a password.', 'error'); return; }
        if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }

        btn.disabled = true;
        btn.textContent = 'Creating account...';

        try {
            const res = await fetch(`${CONFIG.BACKEND_URL}/team/accept-invite`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: inviteToken, name, password })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Failed to create account.');

            showMsg('Account created! Redirecting to login...', 'success');
            btn.style.display = 'none';
            setTimeout(() => window.location.href = 'login.html', 1800);

        } catch (err) {
            showMsg(err.message, 'error');
            btn.disabled = false;
            btn.textContent = 'Create Account & Join Team';
        }
    }

    function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = `msg ${type}`;
        el.style.display = 'block';
    }
</script>
</body>
</html>
