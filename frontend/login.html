<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CorpoCalm Gateway - HR Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card { background: white; width: 420px; border-radius: 14px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .card-header { background: linear-gradient(135deg, #1a237e, #283593); color: white; padding: 32px; text-align: center; }
        .card-header h1 { font-size: 24px; margin-bottom: 4px; }
        .card-header p { font-size: 13px; opacity: 0.8; }
        .card-body { padding: 32px; }
        .tabs { display: flex; margin-bottom: 24px; border-bottom: 2px solid #eee; }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 600; font-size: 14px; color: #888; border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
        .tab.active { color: #1a237e; border-bottom-color: #1a237e; }
        label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; margin-top: 14px; }
        input { width: 100%; padding: 11px 14px; border: 1px solid #ddd; border-radius: 7px; font-size: 14px; transition: border 0.2s; }
        input:focus { border-color: #3f51b5; outline: none; box-shadow: 0 0 0 3px rgba(63,81,181,0.1); }
        button.primary { width: 100%; padding: 13px; background: #1a237e; color: white; border: none; border-radius: 7px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 20px; transition: background 0.2s; }
        button.primary:hover { background: #283593; }
        button.primary:disabled { background: #aaa; cursor: not-allowed; }
        .msg { margin-top: 14px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
        .msg.error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .msg.success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <h1>CorpoCalm Gateway</h1>
        <p>HR Portal — Login or Sign Up</p>
    </div>
    <div class="card-body">
        <div class="tabs">
            <div class="tab active" id="loginTab" onclick="switchTab('login')">Login</div>
            <div class="tab" id="signupTab" onclick="switchTab('signup')">Sign Up</div>
        </div>

        <!-- Login Form -->
        <div id="loginForm">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="your@email.com">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">
            <button class="primary" id="loginBtn" onclick="login()">Login</button>
        </div>

        <!-- Signup Form -->
        <div id="signupForm" style="display:none;">
            <label>Full Name</label>
            <input type="text" id="signupName" placeholder="Your full name">
            <label>Company Name</label>
            <input type="text" id="signupCompany" placeholder="e.g. Infosys, TCS, Your Startup">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="your@email.com">
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password (min 6 chars)">
            <button class="primary" id="signupBtn" onclick="signup()">Create Account</button>
        </div>

        <div class="msg" id="msg"></div>
    </div>
</div>

<script src="config.js"></script>
<script>
    // If already logged in, redirect to admin
    if (localStorage.getItem('hr_token')) {
        window.location.href = 'admin.html';
    }

    function switchTab(tab) {
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
        document.getElementById('loginTab').classList.toggle('active', tab === 'login');
        document.getElementById('signupTab').classList.toggle('active', tab === 'signup');
        hideMsg();
    }

    async function login() {
        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        const btn      = document.getElementById('loginBtn');

        if (!email || !password) { showMsg('Please fill in all fields.', 'error'); return; }

        btn.disabled = true;
        btn.textContent = 'Logging in...';

        try {
            const res = await fetch(`${CONFIG.BACKEND_URL}/hr/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Login failed');

            // Save token and name
            localStorage.setItem('hr_token', data.token);
            localStorage.setItem('hr_name', data.name);
            localStorage.setItem('hr_company', data.company_name || '');
            localStorage.setItem('hr_role', data.role || 'admin');
            localStorage.setItem('hr_company_id', data.company_id || '');
            localStorage.setItem('hr_email', data.email || '');

            showMsg('Login successful! Redirecting...', 'success');
            setTimeout(() => window.location.href = 'admin.html', 800);

        } catch (err) {
            showMsg(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Login';
        }
    }

    async function signup() {
        const name     = document.getElementById('signupName').value.trim();
        const company  = document.getElementById('signupCompany').value.trim();
        const email    = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value.trim();
        const btn      = document.getElementById('signupBtn');

        if (!name || !company || !email || !password) { showMsg('Please fill in all fields.', 'error'); return; }
        if (password.length < 6) { showMsg('Password must be at least 6 characters.', 'error'); return; }

        btn.disabled = true;
        btn.textContent = 'Creating account...';

        try {
            const res = await fetch(`${CONFIG.BACKEND_URL}/hr/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, company_name: company, email, password })
            });

            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Signup failed');

            showMsg('Account created! Please login.', 'success');
            setTimeout(() => switchTab('login'), 1500);

        } catch (err) {
            showMsg(err.message, 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    }

    function showMsg(text, type) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = `msg ${type}`;
        el.style.display = 'block';
    }

    function hideMsg() {
        document.getElementById('msg').style.display = 'none';
    }
</script>
<footer style="text-align:center;padding:20px;font-size:12px;color:#aaa;margin-top:20px;">
    CorpoCalm Gateway &nbsp;|&nbsp; Built by <strong>Priti Ganesh Lande</strong> &nbsp;|&nbsp; &copy; 2026
</footer>
</body>
</html>
